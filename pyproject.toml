[project]
name = "abl"
version = "0.1.0"
description = "Fast, LLM-free command line for Ableton Live via the AbletonMCP Remote Script socket"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
abl = "abl.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["abl"]

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["live: needs a running Ableton Live with the AbletonMCP Remote Script"]
