[project]
name = "ablanalyze"
version = "0.1.0"
description = "Song analysis for abl: stems, tempo, key, sections, chords, drums, bass, melody -> analysis.json"
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy<2",
    "librosa>=0.10",
    "soundfile>=0.12",
    "demucs>=4.0.1",
    "torch>=2.2",
    "torchaudio>=2.2",
    "basic-pitch>=0.4",
    "yt-dlp",
    "setuptools<80",
    "beat-this>=1.1.0",
    "allin1>=1.1.0",
    "piano-transcription-inference>=0.0.6",
    "transformers>=5.17.0",
    "madmom",
]

[project.scripts]
ablanalyze = "ablanalyze.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ablanalyze"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.uv.sources]
madmom = { git = "https://github.com/CPJKU/madmom" }
